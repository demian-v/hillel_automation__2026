# Зручна альтернатива ручним `docker run` — піднімає обидва контейнери однією командою.
# Обов'язкові за завданням команди `docker run` описані в README.md.
services:
  db:
    image: postgres:16
    container_name: hw29_db
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: hw29_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db          # ім'я сервісу = DNS-ім'я у мережі Docker
      DB_PORT: 5432
      DB_NAME: test_db
      DB_USER: test_user
      DB_PASSWORD: test_password
